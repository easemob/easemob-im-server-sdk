      summary: 根据消息 ID 单向删除群聊漫游消息
      operationId: oneWayClearGroupRoamingMessagesByMsgId
      description: '根据消息 ID 单向删除指定用户的某个群聊会话的一条或多条漫游消息。调用该接口后，该用户的指定漫游消息会从服务器和本地删除，该用户无法从环信服务端拉取到这些消息。若删除了该群聊会话的全部漫游消息，该用户的这个会话在服务端也会被清除，拉取会话列表时拉不到该会话。不过，其他用户不受影响，仍然可以拉取这些漫游消息和会话。文档介绍：https://doc.easemob.com/document/server-side/message_delete.html#%E6%A0%B9%E6%8D%AE%E6%B6%88%E6%81%AF-id-%E5%8D%95%E5%90%91%E5%88%A0%E9%99%A4%E7%BE%A4%E8%81%8A%E6%BC%AB%E6%B8%B8%E6%B6%88%E6%81%AF'
      parameters:
        - schema:
            type: string
          in: query
          name: groupId
          description: '群组 ID'
          required: true
        - schema:
            type: string
          in: query
          name: msgIdList
          description: '要删除的消息的消息 ID。每次最多可传入 50 个消息 ID，消息 ID 之间以英文逗号分隔，例如 message ID 1,message ID 2'
          required: true
        - schema:
            type: boolean
          in: query
          name: isNotify
          description: '消息删除后，是否同步到消息所属用户的所有在线设备。- （默认）true：是 - false：否'
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: OneWayClearGroupRoamingMessagesByMsgIdResult
                type: object
                properties:
                  requestStatusCode:
                    type: string
