  /chatgroups:
    post:
      tags:
        - Group
      summary: 创建群组
      operationId: createGroup
      description: '创建一个群组，并设置群组名称、群组描述、公开群/私有群属性、群成员最大人数（包括群主）、加入公开群是否需要批准、群主、群成员和群组扩展信息。文档介绍：https://docs-im-beta.easemob.com/document/server-side/group.html#%E5%88%9B%E5%BB%BA%E7%BE%A4%E7%BB%84'
      requestBody:
        content:
          application/json:
            schema:
              title: CreateGroup
              type: object
              properties:
                groupid:
                  type: string
                  description: 自定义群组id。如需该功能，请联系环信商务
                groupname:
                  type: string
                  description: 群组名称，最大长度为 128 字符
                avatar:
                  type: string
                  description: 群组头像的 URL，最大长度为 1024 字符
                description:
                  type: string
                  description: 群组描述，最大长度为 512 字符
                public:
                  type: boolean
                  description: 是否是公开群。公开群可以被搜索到，用户可以申请加入公开群；私有群无法被搜索到，因此需要群主或群管理员添加，用户才可以加入。 - true：公开群； - false：私有群
                scale:
                  type: string
                  description: 群组规模，取决于群成员总数 maxusers 参数。 - （默认）normal：普通群，即群成员总数不超过 3000。 - large：大型群，群成员总数超过 3000 注意： - 创建大型群时，该参数必传； - 大型群不支持离线推送。仅旗舰版支持创建大型群，如需该功能，请联系环信商务
                maxusers:
                  type: integer
                  description: 群组最大成员数（包括群主）。对于普通群，该参数的默认值为 200，大型群为 1000。不同套餐支持的人数上限不同，详见 产品价格
                allowinvites:
                  type: boolean
                  description: 是否允许群成员邀请用户加入群组： - true：群成员可拉人入群; - （默认）false：只有群主或者管理员才可以拉人入群。 注：该参数仅对私有群有效，因为公开群不允许群成员邀请其他用户入群
                membersonly:
                  type: boolean
                  description: 用户申请入群是否需要群主或者群管理员审批。
                                - true：需要；
                                - （默认）false：不需要，用户直接进群。
                                该参数仅对公开群生效，因为对于私有群，用户无法申请加入群组，只能通过群成员邀请加入群
                invite_need_confirm:
                  type: boolean
                  description: 邀请用户入群时是否需要被邀用户同意。 - （默认）true：是； - false：否
                owner:
                  type: string
                  description: 群主的用户 ID
                members:
                  type: array
                  description: 群成员的用户 ID 数组，不包含群主的用户 ID。该数组可包含的元素数量不超过 maxusers 的值
                  items:
                    type: string
                custom:
                  type: string
                  description: '群组扩展信息，例如可以给群组添加业务相关的标记，不要超过 1,024 字符'
              required:
                - public
                - owner
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: CreateGroupResult
                type: object
                properties:
                  data:
                    title: CreateGroupResource
                    type: object
                    properties:
                      groupid:
                        type: string
