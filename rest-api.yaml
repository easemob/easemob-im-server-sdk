    delete:
      tags:
        - Message
      summary: 单向删除会话
      operationId: oneWayDeleteConversation
      description: '该方法使聊天用户能够从服务器中删除会话。删除会话后，该用户将从服务器获取不到该会话。该会话的其他参与聊天用户仍然可以从服务器获取会话内容。文档介绍：https://docs-im-beta.easemob.com/document/server-side/message_recall.html#%E5%8D%95%E5%90%91%E5%88%A0%E9%99%A4%E4%BC%9A%E8%AF%9D'
      requestBody:
        content:
          application/json:
            schema:
              title: OneWayDeleteConversation
              type: object
              properties:
                channel:
                  type: string
                  description: 要删除的会话 ID。该参数的值取决于会话类型 type 的值 - type 为 chat，即单聊时，会话 ID 为对端用户 ID； - type 为 groupchat，即群聊时，会话 ID 为群组 ID
                type:
                  type: string
                  description: 会话类型。 - chat：单聊会话； - groupchat：群聊会话
                delete_roam:
                  type: boolean
                  description: 是否删除该会话在服务端的漫游消息。 - true：是。若删除了该会话的服务端消息，则用户无法从服务器拉取该会话的漫游消息。 - false：否。用户仍可以从服务器拉取该会话的漫游消息
              required:
                - channel
                - type
                - delete_roam
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: OneWayDeleteConversationResult
                type: object
                properties:
                  data:
                    title: OneWayDeleteConversationResource
                    type: object
                    properties:
                      result:
                        type: string
