      requestBody:
        content:
          application/json:
            schema:
              title: SetPushBindingInfo
              type: object
              properties:
                device_id:
                  type: string
                  description: 移动端设备标识，服务端用于识别设备，进行推送信息的绑定和解绑
                notifier_name:
                  type: string
                  description: 推送证书名称。
                                - 传入的证书名称必需与你在环信控制台的添加推送证书页面上填写的证书名称一致，否则推送失败
                                - 若 notifier_name 为空，表示解除当前设备与所有推送信息的绑定
                device_token:
                  type: string
                  description: 推送设备 token。错误的信息会推送失败，且服务端自动解除绑定。若 device_token 为空，则会解除当前用户当前设备 ID 和当前证书名的绑定
      responses:
