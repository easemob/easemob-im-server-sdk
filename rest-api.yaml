  /messages/msg_recall:
    post:
      tags:
        - Message
      summary: 撤回消息
      operationId: recallMessage
      description: '发送方可以撤回一条发送成功的消息。默认情况下，发送方可撤回发出 2 分钟内的消息。文档介绍：https://docs-im-beta.easemob.com/document/server-side/message_recall.html#%E6%92%A4%E5%9B%9E%E6%B6%88%E6%81%AF'
      requestBody:
        content:
          application/json:
            schema:
              title: RecallMessage
              type: object
              properties:
                msg_id:
                  type: string
                  description: 要撤回消息的消息 ID。由于每次只能撤销一条消息，因此只能传入一个消息 ID
                to:
                  type: string
                  description: 要撤回消息的接收方。 - 单聊为接收方用户 ID； - 群聊为群组 ID； - 聊天室聊天为聊天室 ID。 若不传入该参数，请求失败
                chat_type:
                  type: string
                  description: 要撤回消息的会话类型： - chat：单聊； - groupchat：群聊 ； - chatroom：聊天室
                from:
                  type: string
                  description: 消息撤回方的用户 ID。若不传该参数，默认为 admin
                force:
                  type: boolean
                  description: 是否支持撤回超过服务器存储时长的消息。 - true：是。这种情况下，你可以撤回在撤回时长内的消息，也可以撤回超过服务器存储时长的消息。对于后者，该接口会撤回接收方在本地保存的消息。若消息发送的时间介于你的撤回时长和服务器存储时长之间，则撤回失败。例如，如果消息的撤回时长为 2 分钟，在服务器上的存储时长为 7 天，你可以撤回 2 分钟以内发送的消息或发送时间超过 7 天的消息；若消息发送了 3 分钟，则撤回失败。 - false：否，不支持撤回超过服务器存储时长的消息。如果你采用默认的 2 分钟撤回时长或联系了商务设置了撤回时长，服务器只能撤回指定时长内发送的消息，超过该时长的消息无法撤回。例如，你设置的撤回时长为 3 分钟，若消息发送了 4 分钟，则撤回失败
                recallMessageExtensionInfo:
                  type: string
                  description: 消息撤回相关的扩展信息
              required:
                - msg_id
                - to
                - chat_type
                - force
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: RecallMessageResult
                type: object
                properties:
                  data:
                    title: RecallMessageResource
                    type: object
                    properties:
                      recalled:
                        type: string
  /messages/batch_recall:
    post:
      tags:
        - Message
      summary: 批量撤回消息
      operationId: batchRecallMessages
      description: '一次可撤回发送成功的多条消息，每次最多可撤回 30 条。文档介绍：https://doc.easemob.com/document/server-side/message_recall_batch.html'
      requestBody:
        content:
          application/json:
            schema:
              title: BatchRecallMessages
              type: object
              properties:
                msgs:
                  type: array
                  description: 要撤回的消息详情列表，单次最多可撤回 30 条
                  items:
                    type: object
                    properties:
                      msg_id:
                        type: string
                        description: 要撤回消息的消息 ID
                      to:
                        type: string
                        description: 要撤回消息的接收方。单聊为接收方用户 ID；群聊为群组 ID；聊天室为聊天室 ID
                      from:
                        type: string
                        description: 消息撤回方的用户 ID。若不传该参数，默认为 admin
                      chat_type:
                        type: string
                        description: 要撤回消息的会话类型：- chat：单聊；- groupchat：群聊；- chatroom：聊天室
                      sync_device:
                        type: boolean
                        description: 是否将单聊消息撤回同步给消息发送方的所有在线设备。-（默认）true：是；- false：否
                      force:
                        type: boolean
                        description: 是否支持强制撤回消息。- true：是，无论消息是否过期均可撤回；- false：否，只能在撤回时长内撤回
                    required:
                      - msg_id
                      - to
                      - chat_type
                      - force
                recallMessageExtensionInfo:
                  type: string
                  description: 消息撤回相关的扩展信息
              required:
                - msgs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: BatchRecallMessagesResult
                type: object
                properties:
                  data:
                    type: array
                    items:
                      title: BatchRecallMessageResource
                      type: object
                      properties:
                        msg_id:
                          type: string
                          description: 撤回的消息 ID
                        recalled:
                          type: string
                          description: 消息撤回结果，成功为 yes
                        from:
                          type: string
                          description: 消息撤回方的用户 ID
                        to:
                          type: string
                          description: 撤回消息的送达方
                        chattype:
                          type: string
                          description: 撤回消息的会话类型：chat、groupchat 或 chatroom
  '/users/{username}/user_channel':
    parameters:
      - schema:
          type: string
        name: username
        description: 要删除会话的用户的唯一标识符，即用户 ID
        in: path
