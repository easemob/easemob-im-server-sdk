    put:
      tags:
        - Room
      summary: 设置聊天室自定义属性
      operationId: setRoomCustomAttributes
      description: '指定用户设置特定聊天室的自定义属性。文档介绍：https://docs-im-beta.easemob.com/document/server-side/chatroom.html#%E8%AE%BE%E7%BD%AE%E8%81%8A%E5%A4%A9%E5%AE%A4%E8%87%AA%E5%AE%9A%E4%B9%89%E5%B1%9E%E6%80%A7'
      requestBody:
        content:
          application/json:
            schema:
              title: SetRoomCustomAttributes
              type: object
              properties:
                metaData:
                  description: '聊天室的自定义属性，存储为键值对（key-value）集合，即 Map<String,String>。该集合中最多可包含 10 个键值对，在每个键值对中，key 为属性名称，最多可包含 128 个字符；value 为属性值，不能超过 4096 个字符。每个聊天室最多可有 100 个自定义属性，每个应用的聊天室自定义属性总大小为 10 GB。 key 支持以下字符集： - 26 个小写英文字母 a-z； - 26 个大写英文字母 A-Z； - 10 个数字 0-9； - “_”, “-”, “.”'
                  type: object
                autoDelete:
                  description: 当前成员退出聊天室时是否自动删除该自定义属性。 -（默认）'DELETE'：是； - 'NO_DELETE'：否
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: SetRoomCustomAttributesResult
                type: object
                properties:
                  data:
                    title: SetRoomCustomAttributesResource
                    type: object
                    properties:
                      successKeys:
                        type: array
                        items:
                          type: string
                      errorKeys:
                        type: object
    delete:
      tags:
        - Room
      summary: 删除聊天室自定义属性
      operationId: deleteRoomCustomAttributes
      description: '用户删除其设置的聊天室自定义属性。该方法只能删除当前用户设置的聊天室自定义属性，不能删除其他成员设置的自定义属性。该方法每次最多可删除 10 个自定义属性。文档介绍：https://docs-im-beta.easemob.com/document/server-side/chatroom.html#%E5%88%A0%E9%99%A4%E8%81%8A%E5%A4%A9%E5%AE%A4%E8%87%AA%E5%AE%9A%E4%B9%89%E5%B1%9E%E6%80%A7'
      requestBody:
        content:
          application/json:
            schema:
              title: DeleteRoomCustomAttributes
              type: object
              properties:
                keys:
                  description: 聊天室自定义属性名称列表。每次最多可传 10 个自定义属性名称
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: DeleteRoomCustomAttributesResult
                type: object
                properties:
                  data:
                    title: DeleteRoomCustomAttributesResource
                    type: object
                    properties:
                      successKeys:
                        type: array
                        items:
                          type: string
                      errorKeys:
                        type: object
