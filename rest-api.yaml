  '/users/{username}/notification/{chattype}/{key}':
    parameters:
      - schema:
          type: string
        name: username
        in: path
        required: true
      - schema:
          type: string
        name: chattype
        description: 对象类型，即会话类型：
                    - user：用户，表示单聊；
                    - chatgroup：群组，表示群聊
        in: path
        required: true
      - schema:
          type: string
        name: key
        description: 对象名称：
                    - 单聊时为对端用户的用户 ID；
                    - 群聊时为群组 ID
        in: path
        required: true
    put:
      tags:
        - Push
      summary: 设置离线推送（新）
      operationId: setOfflinePushNew
      description: '你可以设置全局离线推送的通知方式和免打扰模式以及单个单聊或群聊会话的离线推送设置。文档介绍：https://docs-im-beta.easemob.com/document/server-side/push.html#%E8%AE%BE%E7%BD%AE%E7%A6%BB%E7%BA%BF%E6%8E%A8%E9%80%81'
      requestBody:
        content:
          application/json:
            schema:
              title: SetOfflinePushNew
              type: object
              properties:
                type:
                  type: string
                  description: 离线推送通知方式：
                                - DEFAULT：指定的会话采用 app 的设置。该值仅对单聊或群聊会话有效，对 app 级别无效。
                                - ALL：接收全部离线消息的推送通知；
                                - AT：只接收提及当前用户的离线消息的推送通知。该字段推荐在群聊中使用。若提及一个或多个用户，需在创建消息时对 ext 字段传 "em_at_list":["user1", "user2" ...]；若提及所有人，对该字段传 "em_at_list":"all"。
                                - NONE：不接收离线消息的推送通知
                               注意：若 app 和指定会话均设置了该参数，则该会话采用自身的设置，其他会话采用 app 的设置
                ignoreInterval:
                  type: string
                  description: 每天触发离线推送免打扰的时间段，精确到分钟，格式为 HH:MM-HH:MM，例如 08:30-10:00。该时间为 24 小时制，免打扰时间段的开始时间和结束时间中的小时数和分钟数的取值范围分别为 [00,23] 和 [00,59]。
                                该参数的设置说明如下：
                                - 该参数仅针对 app 生效，对单聊或群聊不生效。
                                - 该参数设置后，免打扰模式每天定时触发。例如，开始时间为 08:00，结束时间为 10:00，免打扰模式在每天的 8:00-10:00 内生效。若你在 11:00 设置开始时间为 08:00，结束时间为 12:00，则免打扰模式在当天的 11:00-12:00 生效，以后每天均在 8:00-12:00 生效。
                                - 若开始时间和结束时间相同，则全天免打扰。
                                - 若结束时间早于开始时间，则免打扰模式在每天的开始时间到次日的结束时间内生效。例如，开始时间为 10:00，结束时间为 08:00，则免打扰模式的在当天的 10:00 到次日的 8:00 生效。
                                - 目前仅支持在每天的一个指定时间段内开启免打扰模式，不支持多个免打扰时间段，新的设置会覆盖之前的设置。
                                - 若不设置该参数，传空字符串。
                                - 若该参数和 ignoreDuration 均设置，免打扰模式当日在这两个时间段均生效，例如，例如，上午 8:00 将 app 级的 ignoreInterval 设置为 8:00-10:00，ignoreDuration 设置为 14400000 毫秒（4 个小时），则 app 在今天 8:00-12:00 和以后每天 8:00-10:00 处于免打扰模式
                ignoreDuration:
                  type: number
                  description: 离线推送免打扰时长，单位为毫秒。该参数的取值范围为 [0,604800000]，0 表示该参数无效，604800000 表示免打扰模式持续 7 天。
                                - 该参数对 app 和单聊和群聊均生效。
                                - 与 ignoreInterval 的设置每天生效不同，该参数为一次有效，设置后立即生效，例如，上午 8:00 将 app 层级的 ignoreDuration 设置为 14400000 毫秒（4 个小时），则 app 只在今天 8:00-12:00 处于免打扰模式。
                                - 若该参数和 ignoreDuration 均设置，免打扰模式当日在这两个时间段均生效，例如，上午 8:00 将 app 级的 ignoreInterval 设置为 8:00-10:00，ignoreDuration 设置为 14400000 毫秒（4 个小时），则 app 在今天 8:00-12:00 和以后每天 8:00-10:00 处于免打扰模式
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: SetOfflinePushNewResult
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OfflinePushNewResource'
    get:
      tags:
        - Push
      summary: 查询离线推送设置
      operationId: getOfflinePush
      description: '查询指定单聊、指定群聊或全局的离线推送设置。文档介绍：https://docs-im-beta.easemob.com/document/server-side/push.html#%E6%9F%A5%E8%AF%A2%E7%A6%BB%E7%BA%BF%E6%8E%A8%E9%80%81%E8%AE%BE%E7%BD%AE'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GetOfflinePushResult
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OfflinePushNewResource'
