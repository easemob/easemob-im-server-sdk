    put:
      tags:
        - Group
      summary: 修改群组信息
      operationId: modifyGroup
      description: '修改指定的群组信息，可修改 groupname、description、maxusers、membersonly、allowinvites、invite_need_confirm、public 和 custom 属性。也可以转让群组，如果转让群组，请在请求body中只设置 newowner 即可，newowner 为群组新所有者的用户 ID。如果传入其他字段，或传入的字段不存在，则不能修改的字段会抛出异常。文档介绍：https://docs-im-beta.easemob.com/document/server-side/group.html#%E4%BF%AE%E6%94%B9%E7%BE%A4%E7%BB%84%E4%BF%A1%E6%81%AF 和 '
      requestBody:
        content:
          application/json:
            schema:
              title: ModifyGroup
              type: object
              properties:
                groupname:
                  type: string
                  description: 群组名称，最大长度为 128 字符
                avatar:
                  type: string
                  description: 群组头像的 URL，最大长度为 1024 字符
                description:
                  type: string
                  description: 群组描述，最大长度为 512 字符
                public:
                  type: boolean
                  description: 是否是公开群。 - true：公开群； - false：私有群
                maxusers:
                  type: integer
                  description: 群组最大成员数（包括群主）。对于普通群，该参数的默认值为 200，大型群为 1000。不同套餐支持的人数上限不同，详见 产品价格
                allowinvites:
                  type: boolean
                  description: 是否允许群成员邀请用户加入群组： - true：群成员可拉人入群; - （默认）false：只有群主或者管理员才可以拉人入群。 注：该参数仅对私有群有效，因为公开群不允许群成员邀请其他用户入群
                membersonly:
                  type: boolean
                  description: 加入群组是否需要群主或者群管理员审批：
                                - true：是；
                                - false：否
                invite_need_confirm:
                  type: boolean
                  description: 邀请用户入群时是否需要被邀用户同意。 - （默认）true：是； - false：否
                custom:
                  type: string
                  description: '群组扩展信息，例如可以给群组添加业务相关的标记，不要超过 1,024 字符'
                newowner:
                  type: string
                  description: 群组的新管理员的用户 ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: ModifyGroupResult
                type: object
                properties:
                  data:
                    title: ModifyGroupResource
                    type: object
