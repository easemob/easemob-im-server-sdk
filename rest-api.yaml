      operationId: createRoom
      description: '创建一个聊天室，需设置聊天室名称、聊天室描述、聊天室成员最大人数（包括管理员）、聊天室管理员和普通成员以及聊天室扩展信息。文档介绍：https://docs-im-beta.easemob.com/document/server-side/chatroom.html#%E5%88%9B%E5%BB%BA%E8%81%8A%E5%A4%A9%E5%AE%A4'
      requestBody:
        content:
          application/json:
            schema:
              title: CreateRoom
              type: object
              properties:
                groupid:
                  type: string
                  description: 自定义聊天室id。如需该功能，请联系环信商务
                name:
                  description: 聊天室名称，最大长度为 128 个字符
                  type: string
                description:
                  description: 聊天室描述，最大长度为 512 个字符
                  type: string
                maxusers:
                  description: '聊天室最大成员数（包括聊天室所有者）。取值范围为 [1,10,000]，默认值为 1000。如需调整请联系商务'
                  type: integer
                owner:
                  description: 聊天室所有者
                  type: string
                members:
