openapi: 3.0.3
info:
  title: EMService
  description: Easemob Rest API
  version: 1.0.0
servers:
  - url: 'http://localhost:8080/{orgName}/{appName}'
paths:
  /token:
    post:
      tags:
        - Token
      summary: 获取 Token，可以获取管理员或者用户权限 Token
      operationId: getToken
      description: '管理员权限 Token 可以用来调用环信 Rest API 接口，获取管理员 Token 文档介绍：https://docs-im-beta.easemob.com/document/server-side/easemob_app_token.html，获取用户 Token 文档介绍：https://docs-im-beta.easemob.com/document/server-side/easemob_user_token.html'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GetToken
                type: object
                properties:
                  access_token:
                    type: string
  /push/nickname:
    put:
      tags:
        - User
      summary: 批量修改用户推送昵称
      operationId: modifyPushNicknames
      description: '管理员权限 Token 可以用来调用环信 Rest API 接口，获取管理员 Token 文档介绍：https://docs-im-beta.easemob.com/document/server-side/easemob_app_token.html，获取用户 Token 文档介绍：https://docs-im-beta.easemob.com/document/server-side/easemob_user_token.html'
      requestBody:
        content:
          application/json:
            schema:
              title: ModifyPushNicknames
              type: array
              items:
                $ref: '#/components/schemas/ModifyPushNickname'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: ModifyPushNicknamesResult
                type: object
                properties:
                  entities:
                    title: Entities
                    type: array
                    items:
                      title: ModifyPushNicknameResource
                      type: object
                      properties:
                        push_nickname:
                          type: string
                        username:
                          type: string
  /push/label:
    post:
      tags:
        - Push
      summary: 创建推送标签
      operationId: createPushLabel
      description: '为推送的目标用户添加标签，对用户进行分组，实现精细化推送。当前最多可创建 100 个推送标签。如需提升该上限，请联系商务。 文档介绍：https://doc.easemob.com/push/push_by_tag.html#%E5%88%9B%E5%BB%BA%E6%8E%A8%E9%80%81%E6%A0%87%E7%AD%BE'
      requestBody:
        content:
          application/json:
            schema:
              title: CreatePushLabel
              type: object
              properties:
                name:
                  type: string
                  description: 要创建的推送标签的名称，不能超过 64 个字符。支持以下字符集：
                                - 26 个小写英文字母 a-z
                                - 26 个大写英文字母 A-Z
                                - 10 个数字 0-9
                                - “_“,”-“,”.” 标签名称区分大小写，因此 Aa 和 aa 为两个标签名称 。
                                同一个 app 下，标签名称必须唯一
                description:
                  type: string
                  description: 推送标签的描述，不能超过 255 个字符
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: CreatePushLabelResult
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CreatePushLabelResource'
    get:
      tags:
        - Push
      summary: 分页查询推送标签
      operationId: getPushLabels
      description: '分页查询推送标签。文档介绍：https://doc.easemob.com/push/push_by_tag.html#%E5%88%86%E9%A1%B5%E6%9F%A5%E8%AF%A2%E6%8E%A8%E9%80%81%E6%A0%87%E7%AD%BE'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GetPushLabelsResult
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GetPushLabelsResource'
  /push/label/{labelname}:
    parameters:
      - schema:
          type: string
        name: labelname
        description: 要查询的推送标签的名称
        in: path
        required: true
    get:
      tags:
        - Push
      summary: 查询指定的推送标签
      operationId: getPushLabel
      description: '查询指定的推送标签。文档介绍：https://doc.easemob.com/push/push_by_tag.html#%E6%9F%A5%E8%AF%A2%E6%8C%87%E5%AE%9A%E7%9A%84%E6%8E%A8%E9%80%81%E6%A0%87%E7%AD%BE'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GetPushLabelResult
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GetPushLabelResource'
    delete:
      tags:
        - Push
      summary: 删除指定的推送标签
      operationId: deletePushLabel
      description: '删除指定的推送标签。每次只能删除单个推送标签。文档介绍：https://doc.easemob.com/push/push_by_tag.html#%E5%88%A0%E9%99%A4%E6%8C%87%E5%AE%9A%E7%9A%84%E6%8E%A8%E9%80%81%E6%A0%87%E7%AD%BE'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: DeletePushLabelResult
                type: object
                properties:
                  data:
                    type: string
                    description: 推送标签成功删除的结果
  /push/label/{labelname}/user:
    parameters:
      - schema:
          type: string
        name: labelname
        description: 推送标签的名称
        in: path
        required: true
    post:
      tags:
        - Push
      summary: 在推送标签下添加用户
      operationId: addUsersUnderPushLabel
      description: '为用户分配指定的推送标签。 文档介绍：https://doc.easemob.com/push/push_by_tag.html#%E5%9C%A8%E6%8E%A8%E9%80%81%E6%A0%87%E7%AD%BE%E4%B8%8B%E6%B7%BB%E5%8A%A0%E7%94%A8%E6%88%B7'
      requestBody:
        content:
          application/json:
            schema:
              title: AddUsersUnderPushLabel
              type: object
              properties:
                usernames:
                  type: array
                  description: 推送标签下的用户 ID 列表，最多可传 100 个用户 ID
                  items:
                    type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: AddUsersUnderPushLabelResult
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AddUsersUnderPushLabelResource'
    get:
      tags:
        - Push
      summary: 分页查询指定标签下的用户
      operationId: getUsersUnderPushLabel
      description: '分页查询指定标签下的用户。文档介绍：https://doc.easemob.com/push/push_by_tag.html#%E5%88%86%E9%A1%B5%E6%9F%A5%E8%AF%A2%E6%8C%87%E5%AE%9A%E6%A0%87%E7%AD%BE%E4%B8%8B%E7%9A%84%E7%94%A8%E6%88%B7'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GetUsersUnderPushLabelResult
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GetUsersUnderPushLabelResource'
    delete:
      tags:
        - Push
      summary: 批量移出指定推送标签下的用户
      operationId: deleteUsersUnderPushLabel
      description: '一次移除指定推送标签下的单个或多个用户。 文档介绍：https://doc.easemob.com/push/push_by_tag.html#%E6%89%B9%E9%87%8F%E7%A7%BB%E5%87%BA%E6%8C%87%E5%AE%9A%E6%8E%A8%E9%80%81%E6%A0%87%E7%AD%BE%E4%B8%8B%E7%9A%84%E7%94%A8%E6%88%B7'
      requestBody:
        content:
          application/json:
            schema:
              title: DeleteUsersUnderPushLabel
              type: object
              properties:
                usernames:
                  type: array
                  description: 要移出标签的用户 ID 列表，最多可传 100 个用户 ID
                  items:
                    type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: DeleteUsersUnderPushLabelResult
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DeleteUsersUnderPushLabelResource'
  /push/label/{labelname}/user/{username}:
    parameters:
      - schema:
          type: string
        name: labelname
        description: 推送标签的名称
        in: path
        required: true
      - schema:
          type: string
        name: username
        description: 要查询的用户 ID
        in: path
        required: true
    get:
      tags:
        - Push
      summary: 查询指定标签下的指定用户
      operationId: getUserUnderPushLabel
      description: '查询推送标签是否存在指定用户。若存在，返回该用户的用户 ID 以及为该用户添加标签的时间；若不存在则不返回这些信息。文档介绍：https://doc.easemob.com/push/push_by_tag.html#%E6%9F%A5%E8%AF%A2%E6%8C%87%E5%AE%9A%E6%A0%87%E7%AD%BE%E4%B8%8B%E7%9A%84%E6%8C%87%E5%AE%9A%E7%94%A8%E6%88%B7'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GetUserUnderPushLabelResult
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GetUserUnderPushLabelResource'
  /users:
    post:
      tags:
        - User
      summary: 批量注册用户
      operationId: createUsers
      description: '文档介绍：https://docs-im-beta.easemob.com/document/server-side/account_system.html#%E6%89%B9%E9%87%8F%E6%B3%A8%E5%86%8C%E7%94%A8%E6%88%B7'
      requestBody:
        content:
          application/json:
            schema:
              title: CreateUsers
              type: array
              items:
                $ref: '#/components/schemas/CreateUser'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: CreateUsersResult
                type: object
                properties:
                  entities:
                    title: Entities
                    type: array
                    items:
                      title: CreateUserResource
                      type: object
                      properties:
                        uuid:
                          type: string
                        created:
                          type: number
                        username:
                          type: string
                        nickname:
                          type: string
                        activated:
                          type: boolean
                  data:
                    title: Data
                    type: array
                    items:
                      title: CreateUserFailResource
                      type: object
                      properties:
                        username:
                          type: string
                        registerUserFailReason:
                          type: string
    get:
      tags:
        - User
      summary: 获取用户列表
      operationId: getUsers
      description: '该接口查询多个用户的信息列表，按照用户创建时间顺序返回。文档介绍：https://docs-im-beta.easemob.com/document/server-side/account_system.html#%E6%89%B9%E9%87%8F%E8%8E%B7%E5%8F%96%E7%94%A8%E6%88%B7%E8%AF%A6%E6%83%85'
      parameters:
        - schema:
            type: integer
          in: query
          name: limit
          description: '请求查询用户的数量。取值范围为 [1,100]，默认值为 10。若实际用户数量超过 100，返回 100 个用户'
          required: false
        - schema:
            type: string
          in: query
          name: cursor
          description: 开始获取数据的游标位置，用于分页显示用户列表。第一次发起批量查询用户请求时若不设置 cursor，请求成功后会获得第一页用户列表。从响应 body 中获取 cursor，并在下一次请求的 URL 中传入该 cursor，直到响应 body 中不再有 cursor 字段，则表示已查询到 app 中所有用户
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GetUsersResult
                type: object
                properties:
                  entities:
                    title: Entities
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResource'
                  cursor:
                    type: string
    delete:
      tags:
        - User
      summary: 批量删除用户
      operationId: deleteUsers
      description: '删除某个 App 下指定数量的用户账号。建议一次删除的用户数量不要超过100。需要注意的是，这里只指定了要删除的用户数量，并未指定要删除的具体用户，你可以在响应中查看删除的用户。文档介绍：https://docs-im-beta.easemob.com/document/server-side/account_system.html#%E6%89%B9%E9%87%8F%E8%8E%B7%E5%8F%96%E7%94%A8%E6%88%B7%E8%AF%A6%E6%83%85'
      parameters:
        - schema:
            type: integer
          in: query
          name: limit
          description: '要删除的用户的数量。取值范围为 [1,100]，默认值为 10'
          required: false
        - schema:
            type: string
          in: query
          name: cursor
          description: 开始删除用户的游标位置。第一次批量删除时若不设置 cursor，请求成功后会从最先创建的用户开始删除 limit 指定的用户数量。从响应 body 中获取 cursor，并在下一次请求的 URL 中传入该 cursor，直到响应 body 中不再有 cursor 字段，则表示已完全删除 app 中的所有用户
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: DeleteUsersResult
                type: object
                properties:
                  entities:
                    title: Entities
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResource'
                  cursor:
                    type: string
  '/users/{username}':
    parameters:
      - schema:
          type: string
        name: username
        description: 用户 ID
        in: path
        required: true
    get:
      tags:
        - User
      summary: 获取用户详情
      operationId: getUser
      description: '文档介绍：https://docs-im-beta.easemob.com/document/server-side/account_system.html#%E8%8E%B7%E5%8F%96%E5%8D%95%E4%B8%AA%E7%94%A8%E6%88%B7%E7%9A%84%E8%AF%A6%E6%83%85'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GetUserResult
                type: object
                properties:
                  entities:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResource'
    put:
      tags:
        - Push
      summary: 离线推送设置。包括设置离线推送时显示的昵称、设置离线推送通知的展示方式、设置免打扰模式
      operationId: setOfflinePushOld
      description: '离线推送设置。文档介绍：https://docs-im-beta.easemob.com/document/server-side/push.html#%E8%AE%BE%E7%BD%AE%E7%A6%BB%E7%BA%BF%E6%8E%A8%E9%80%81%E6%97%B6%E6%98%BE%E7%A4%BA%E7%9A%84%E6%98%B5%E7%A7%B0、https://docs-im-beta.easemob.com/document/server-side/push.html#%E8%AE%BE%E7%BD%AE%E7%A6%BB%E7%BA%BF%E6%8E%A8%E9%80%81%E9%80%9A%E7%9F%A5%E7%9A%84%E5%B1%95%E7%A4%BA%E6%96%B9%E5%BC%8F、https://docs-im-beta.easemob.com/document/server-side/push.html#%E8%AE%BE%E7%BD%AE%E5%85%8D%E6%89%93%E6%89%B0%E6%A8%A1%E5%BC%8F'
      requestBody:
        content:
          application/json:
            schema:
              title: SetOfflinePushOld
              type: object
              properties:
                nickname:
                  type: string
                  description: 离线推送时在接收方的客户端推送通知栏中显示的发送方的昵称。你可以自定义该昵称，长度不能超过 100 个字符。
                                支持以下字符集：
                                - 26 个小写英文字母 a-z；
                                - 26 个大写英文字母 A-Z；
                                - 10 个数字 0-9；
                                - 中文；
                                - 特殊字符。
                                若不设置昵称，推送消息详情时，即设置离线推送通知的展示方式时将 notification_display_style 设置为 1，会显示发送方的用户 ID，而非昵称。
                                    该昵称可与用户属性中的昵称设置不同，不过我们建议这两种昵称的设置保持一致。因此，修改其中一个昵称时，也需调用相应方法对另一个进行更新，确保设置一致。更新用户属性中的昵称的方法，详见 设置用户属性
                notification_display_style:
                  type: integer
                  description: 离线推送通知的展示方式：
                                -（默认）0：推送标题为“您有一条新消息”，推送内容为“请点击查看”；
                                - 1：推送标题为“您有一条新消息”，推送内容为发送人昵称和离线消息的内容
                notification_no_disturbing:
                  type: boolean
                  description: 是否设置为免打扰模式：
                                - true：是；
                                - false：否
                notification_no_disturbing_start:
                  type: string
                  description: 免打扰时间段的开始时间，精确到小时，取值范围为 [0,23]。例如 “8” 表示每日 8:00 开启免打扰模式
                notification_no_disturbing_end:
                  type: string
                  description: 免打扰时间段的结束时间，精确到小时，取值范围为 [0,23]。例如 “18” 表示每日 18:00 关闭免打扰模式
      responses:
        '200':
          description: OK
    delete:
      tags:
        - User
      summary: 删除用户账号
      operationId: deleteUser
      description: '删除单个用户。如果该用户是群主或者聊天室所有者，系统会同时删除对应的群组和聊天室。文档介绍：https://docs-im-beta.easemob.com/document/server-side/account_system.html#%E5%88%A0%E9%99%A4%E5%8D%95%E4%B8%AA%E7%94%A8%E6%88%B7'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: DeleteUserResult
                type: object
                properties:
                  entities:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResource'
  '/users/{username}/password':
    parameters:
      - schema:
          type: string
        name: username
        description: 用户 ID
        in: path
        required: true
    put:
      tags:
        - User
      summary: 修改用户密码
      operationId: modifyUserPassword
      description: '通过服务端接口修改用户的登录密码，不需要提供原密码。文档介绍：https://docs-im-beta.easemob.com/document/server-side/account_system.html#%E4%BF%AE%E6%94%B9%E7%94%A8%E6%88%B7%E5%AF%86%E7%A0%81'
      requestBody:
        content:
          application/json:
            schema:
              title: ModifyUserPassword
              type: object
              properties:
                newpassword:
                  type: string
                  description: 用户的新登录密码，长度不可超过 64 个字符
      responses:
        '200':
          description: OK
  '/users/{username}/status':
    parameters:
      - schema:
          type: string
        name: username
        in: path
        required: true
    get:
      tags:
        - User
      summary: 获取单个用户在线状态
      operationId: getUserOnlineState
      description: '查看单个用户是在线还是离线状态。文档介绍：https://docs-im-beta.easemob.com/document/server-side/account_system.html#%E8%8E%B7%E5%8F%96%E5%8D%95%E4%B8%AA%E7%94%A8%E6%88%B7%E5%9C%A8%E7%BA%BF%E7%8A%B6%E6%80%81'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GetUserOnlineStateResult
                type: object
                properties:
                  data:
                    type: object
  '/users/batch/status':
    post:
      tags:
        - User
      summary: 批量获取用户在线状态
      operationId: getUsersOnlineState
      description: '批量查看用户是在线还是离线状态，单次请求最多可查看 100 个用户的在线状态。文档介绍：https://docs-im-beta.easemob.com/document/server-side/account_system.html#%E6%89%B9%E9%87%8F%E8%8E%B7%E5%8F%96%E7%94%A8%E6%88%B7%E5%9C%A8%E7%BA%BF%E7%8A%B6%E6%80%81'
      requestBody:
        content:
          application/json:
            schema:
              title: GetUsersOnlineState
              type: object
              properties:
                usernames:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GetUsersOnlineStateResult
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
  '/users/{username}/resources':
    parameters:
      - schema:
          type: string
        name: username
        in: path
        required: true
    get:
      tags:
        - User
      summary: 获取指定账号的在线登录设备列表
      operationId: getUserOnlineLoginDeviceList
