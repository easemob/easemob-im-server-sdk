          in: query
          name: pageSize
          description: 每页显示的订阅用户数量。取值范围为 [1,500]，若不传默认值为 1
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GetUserSubscriptionListResult
                type: object
                properties:
                  result:
                    title: GetUserSubscriptionListResource
                    type: object
                    properties:
                      totalnum:
                        type: integer
                      sublist:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserSubscriptionResource'
  '/presence/online/{group_id}/type/{query_type}':
    parameters:
      - schema:
          type: string
        name: group_id
        description: 群组 ID
        in: path
        required: true
      - schema:
          type: integer
        name: query_type
        description: 查询类型，查询群组的在线成员数量，传 1 即可
        in: path
        required: true
    get:
      tags:
        - Presence
      summary: 查询单个群组的在线成员数量
      operationId: getGroupOnlineMemberCount
      description: '你可以查询单个群组的在线成员数量。如需使用该 API，需要联系环信商务开通。这里的在线状态指用户的 app 与服务器成功建立连接，不包括用户的自定义在线状态，如忙碌、马上回来等。文档介绍：https://docs-im-beta.easemob.com/document/server-side/presence.html#%E6%9F%A5%E8%AF%A2%E5%8D%95%E4%B8%AA%E7%BE%A4%E7%BB%84%E7%9A%84%E5%9C%A8%E7%BA%BF%E6%88%90%E5%91%98%E6%95%B0%E9%87%8F'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GetGroupOnlineMemberCountResult
                type: object
                properties:
                  result:
                    type: integer
  '/reaction/user/{username}':
    parameters:
      - schema:
          type: string
        name: username
        in: path
        required: true
    post:
      tags:
        - Reaction
      summary: 创建/追加 Reaction
      operationId: setReaction
      description: '在单聊或群聊场景中对单条消息创建或追加 Reaction。创建 Reaction 指对消息添加第一条 Reaction，后续的 Reaction 添加称为追加。文档介绍：https://docs-im-beta.easemob.com/document/server-side/reaction.html#%E5%88%9B%E5%BB%BA-%E8%BF%BD%E5%8A%A0-reaction'
      requestBody:
        content:
          application/json:
            schema:
              title: SetReaction
              type: object
              properties:
                msgId:
                  description: 消息 ID
                  type: string
                message:
                  description: 表情 ID。长度不能超过 128 个字符，必须与客户端的设置一致。该参数对支持的字符集类型没有限制，若使用特殊字符，获取和删除 Reaction 时需对特殊字符进行 URL 编码
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: SetReactionResult
                type: object
                properties:
                  requestStatusCode:
                    type: string
    get:
      tags:
        - Reaction
      summary: 根据消息 ID 获取 Reaction
      operationId: getReaction
      description: '该方法根据单聊或群聊中的消息 ID 获取单个或多个消息的 Reaction 信息，包括 Reaction ID、使用的表情 ID、以及使用该 Reaction 的用户 ID 及用户人数。获取的 Reaction 的用户列表只展示最早三个添加 Reaction 的用户。文档介绍：https://docs-im-beta.easemob.com/document/server-side/reaction.html#%E6%A0%B9%E6%8D%AE%E6%B6%88%E6%81%AF-id-%E8%8E%B7%E5%8F%96-reaction'
      parameters:
        - schema:
            type: array
            items:
              type: string
          in: query
          name: msgIdList
          description: 需要查询的消息 ID 列表，最多可传 20 个消息 ID
          required: true
        - schema:
            type: string
          in: query
          name: msgType
          description: 消息的会话类型：
                        - chat：单聊；
                        - groupchat：群聊
          required: true
        - schema:
            type: string
          in: query
          name: groupId
          description: 群组 ID。如果 msgType 设置为 groupchat，即拉取群中的 Reaction，必须指定群组 ID
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GetReactionResult
                type: object
                properties:
                  requestStatusCode:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GetReactionListResource'
    delete:
      tags:
        - Reaction
      summary: 删除 Reaction
      operationId: deleteReaction
      description: '删除当前用户追加的 Reaction。文档介绍：https://docs-im-beta.easemob.com/document/server-side/reaction.html#%E5%88%A0%E9%99%A4-reaction'
      parameters:
        - schema:
            type: string
          in: query
          name: msgId
          description: 消息 ID
          required: true
        - schema:
            type: string
          in: query
          name: message
          description: 表情 ID。长度不可超过 128 个字符。该参数的值必须与客户端一致
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: DeleteReactionResult
                type: object
                properties:
                  requestStatusCode:
                    type: string
  '/reaction/user/{username}/detail':
    parameters:
      - schema:
          type: string
        name: username
        in: path
        required: true
    get:
      tags:
        - Reaction
      summary: 根据消息 ID 和表情 ID 获取 Reaction 信息
      operationId: getReactionDetail
      description: '在单聊或群聊场景中对单条消息创建或追加 Reaction。创建 Reaction 指对消息添加第一条 Reaction，后续的 Reaction 添加称为追加。文档介绍：https://docs-im-beta.easemob.com/document/server-side/reaction.html#%E5%88%9B%E5%BB%BA-%E8%BF%BD%E5%8A%A0-reaction'
      parameters:
        - schema:
            type: string
          in: query
          name: msgId
          description: 消息 ID
          required: true
        - schema:
            type: string
          in: query
          name: message
          description: 表情 ID。长度不可超过 128 个字符。该参数的值必须与客户端一致
          required: true
        - schema:
            type: integer
          in: query
          name: limit
          description: 每页显示添加 Reaction 的用户数量。取值范围为 [1,50]，默认值为 50
          required: false
        - schema:
            type: string
          in: query
          name: cursor
          description: 查询游标，指定数据查询的起始位置，分页获取时使用
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GetReactionDetailResult
                type: object
                properties:
                  requestStatusCode:
                    type: string
                  data:
                    $ref: '#/components/schemas/ReactionResource'
components:
  schemas:
    CreateToken:
      title: CreateToken
      type: object
      properties:
        grant_type:
          type: string
          description: 授权方式。 - client_credentials：获取 App Token 使用 - password：通过用户 ID 和密码获取用户 Token 使用 - inherit：通过用户 ID 获取用户 Token 使用
        client_id:
          type: string
          description: App 的 client_id，用于生成 App Token 调用 REST API。详见 环信即时通讯云控制台的应用详情页面
        client_secret:
          type: string
          description: App 的 client_secret，用于生成 App Token 调用 REST API。详见 环信即时通讯云控制台的应用详情页面
        username:
          type: string
          description: 用户 ID，通过用户 ID 和密码 或 通过用户 ID获取用户 Token 使用
        password:
          type: string
          description: 用户的登录密码，通过用户 ID 和密码获取用户 Token 使用
        autoCreateUser:
          type: boolean
          description: 当用户不存在时，是否自动创建用户。自动创建用户时，需保证授权方式（grant_type）必须为 inherit，通过用户 ID获取用户 Token 使用
        ttl:
          type: integer
          description: token 有效期，单位为秒
    CreateUser:
      title: CreateUser
      type: object
      properties:
        username:
          type: string
          description: 用户 ID，长度不可超过 64 字节
        password:
          type: string
          description: 用户的登录密码，长度不可超过 64 个字符
        nickname:
          type: string
          description: 离线推送时在接收方的客户端推送通知栏中显示的发送方的昵称。你可以自定义该昵称，长度不能超过 100 个字符。
    CreateMessage:
      title: CreateMessage
      type: object
      properties:
        from:
          type: string
          description: 消息发送方的用户 ID。若不传入该字段，服务器默认设置为管理员，即 “admin”；若传入字段但值为空字符串 (“”)，请求失败
        to:
          type: array
          description: 发送单聊消息 - 消息接收方的用户 ID 数组。每次最多可向 600 个用户发送消息 发送群聊消息 - 消息接收方群组 ID 数组。每次最多可向 3 个群组发送消息 发送聊天室消息 - 消息接收方聊天室 ID 数组。每次最多可向 10 个聊天室发送消息
          items:
            type: string
        type:
          type: string
          description: 消息类型： - txt：文本消息； - img：图片消息； - audio：语音消息； - video：视频消息； - file：文件消息； - loc：位置消息； - cmd：透传消息； - custom：自定义消息。
        body:
          $ref: '#/components/schemas/MessageContent'
        sync_device:
          type: boolean
          description: 消息发送成功后，是否将消息同步到发送方 - true：是； - （默认）false：否
        routetype:
          type: string
          description: 若传入该参数，其值为 ROUTE_ONLINE，表示接收方只有在线时才能收到消息，若接收方离线则无法收到消息。若不传入该参数，无论接收方在线还是离线都能收到消息
        ext:
          type: object
          description: '消息支持扩展字段，可添加自定义信息。不能对该参数传入 null。同时，推送通知也支持自定义扩展字段，详见 APNs 自定义显示：https://docs-im-beta.easemob.com/document/ios/push.html#_4-%E8%AE%BE%E7%BD%AE%E7%A6%BB%E7%BA%BF%E6%8E%A8%E9%80%81 和 Android 推送字段说明：https://docs-im-beta.easemob.com/document/android/push.html#_5-%E8%A7%A3%E6%9E%90%E6%94%B6%E5%88%B0%E7%9A%84%E6%8E%A8%E9%80%81%E5%AD%97%E6%AE%B5'
        chatroom_msg_level:
          type: string
          description: 聊天室消息优先级，仅对发送聊天室消息有效： - high：高； - （默认）normal：普通； - low：低
        roam_ignore_users:
          type: array
          description: 设置哪些用户拉漫游消息时拉不到该消息
          items:
            type: string
        users:
          type: array
          description: 接收消息的群成员或聊天室成员的用户 ID 数组。每次最多可传 20 个用户 ID
          items:
            type: string
      required:
        - to
        - type
        - body
    CreateOnlineUserBroadcastMessage:
      title: CreateOnlineUserBroadcastMessage
      type: object
      properties:
        from:
          type: string
          description: 广播消息发送方的用户 ID。若不传入该字段，服务器默认设置为管理员，即 “admin”；若传入字段但值为空字符串 (“”)，请求失败
        msg:
          $ref: '#/components/schemas/MessageContent'
        ext:
          type: object
          description: '广播消息支持扩展字段，可添加自定义信息。不能对该参数传入 null。'
      required:
        - msg
    MessageTranslate:
      title: MessageTranslate
      type: object
      required:
        - text
        - to
      properties:
        from:
          type: string
          description: 源语言的语言代码，不填则自动检测
        text:
          type: string
          description: 待翻译的文本，最多 10,000 字符
        to:
          type: array
          description: 目标语言代码列表
          items:
            type: string
    CreateChatroomBroadcastMessage:
      title: CreateChatroomBroadcastMessage
      type: object
      properties:
        from:
          type: string
          description: 广播消息发送方的用户 ID。若不传入该字段，服务器默认设置为管理员，即 “admin”；若传入字段但值为空字符串 (“”)，请求失败
        msg:
          $ref: '#/components/schemas/MessageContent'
        ext:
          type: object
          description: '消息支持扩展字段，可添加自定义信息。不能对该参数传入 null。同时，推送通知也支持自定义扩展字段，详见 APNs 自定义显示：https://docs-im-beta.easemob.com/document/ios/push.html#_4-%E8%AE%BE%E7%BD%AE%E7%A6%BB%E7%BA%BF%E6%8E%A8%E9%80%81 和 Android 推送字段说明：https://docs-im-beta.easemob.com/document/android/push.html#_5-%E8%A7%A3%E6%9E%90%E6%94%B6%E5%88%B0%E7%9A%84%E6%8E%A8%E9%80%81%E5%AD%97%E6%AE%B5'
        chatroom_msg_level:
          type: string
          description: 聊天室消息优先级，仅对发送聊天室消息有效： - high：高； - （默认）normal：普通； - low：低
      required:
        - msg
    MessageContent:
      title: MessageContent
      type: object
      description: 消息内容
      properties:
        msg:
          type: string
          description: 消息内容
        type:
          type: string
          description: 聊天室广播消息类型。仅在发送聊天室广播消息时使用
        filename:
          type: string
          description: 图片名称/语音文件的名称/视频文件的名称/文件名称
        secret:
          type: string
          description: 图片/语音/视频/文件的访问密钥，即成功上传图片/语音/视频/文件后，从 文件上传 的响应 body 中获取的 share-secret。如果图片/语音/视频/文件上传时设置了文件访问限制（restrict-access），则该字段为必填
        size:
          title: ImageSize
          type: object
          description: 图片尺寸，单位为像素
          properties:
            height:
              type: integer
              description: 图片高度
            width:
              type: integer
              description: 图片宽度
        url:
          type: string
          description: '图片/语音/视频/文件 URL 地址：https://{host}/{org_name}/{app_name}/chatfiles/{file_uuid}。其中 file_uud 为文件 ID，成功上传图片/语音/视频/文件后，从 文件上传 的响应 body 中获取'
        length:
          type: integer
          description: 语音/视频时长，单位为秒
        thumb:
          type: string
          description: '视频缩略图 URL 地址：https://{host}/{org_name}/{app_name}/chatfiles/{file_uuid}。file_uuid 为视频缩略图唯一标识，成功上传缩略图文件后，从 文件上传 的响应 body 中获取'
        file_length:
          type: integer
          description: 视频文件大小，单位为字节
        thumb_secret:
          type: string
          description: 视频缩略图访问密钥，即成功上传视频文件后，从 文件上传 的响应 body 中获取的 share-secret。如果缩略图文件上传时设置了文件访问限制（restrict-access），则该字段为必填
        lat:
          type: string
          description: 位置的纬度，单位为度
        lng:
          type: string
          description: 位置的经度，单位为度
        addr:
          type: string
          description: 位置的文字描述
        action:
          type: string
          description: 命令内容
        customEvent:
          type: string
          description: '用户自定义的事件类型。该参数的值必须满足正则表达式 [a-zA-Z0-9-_/\.]{1,32}，长度为 1-32 个字符'
        customExts:
          type: object
          description: '用户自定义的事件属性，类型必须是 Map<String,String>，最多可以包含 16 个元素。customExts 是可选的，不需要可以不传'
    UserResource:
      title: UserResource
      type: object
      properties:
        username:
          type: string
          description: 用户 ID
        nickname:
          type: string
          description: 用户推送昵称
        uuid:
          type: string
          description: 用户 ID 的 uuid
        activated:
          type: boolean
          description: 用户是否被封禁
        created:
          type: number
          description: 用户创建的时间
    DeviceResource:
      title: DeviceResource
      type: object
      properties:
        res:
          type: string
          description: 已登录设备的资源 ID，即服务器分配给每个设备资源的唯一标识符
        device_uuid:
          type: string
          description: 已登录设备的 UUID
        device_name:
          type: string
          description: 已登录设备的名称
    UploadChatFileResource:
      title: UploadChatFileResource
      type: object
      properties:
        uuid:
          type: string
          description: 文件 ID，即时通讯服务分配给该文件的唯一标识符。该参数在发送消息时需用到
        type:
          type: string
          description: 文件类型，为固定值 chatfile
        share-secret:
          type: string
          description: 文件访问密钥。你需要自行保存 share-secret，以便 下载文件时使用
    GetHistoryMessageResource:
      title: GetHistoryMessageResource
      type: object
      properties:
        url:
          type: string
          description: 历史消息记录的下载地址。该 URL 由历史消息记录的存储地址、到期 Unix 时间戳（Expires，单位为秒）、第三方云存储访问密钥（OSSAccessKeyId）和第三方云存储验证签名（Signature）组成。URL 仅在一定时间内有效，请及时通过 URL 下载聊天记录文件，URL 过期后会下载失败，需要重新调用该接口获取新的 URL
    GetAppGroupResource:
      title: GetAppGroupResource
      type: object
      properties:
        owner:
          type: string
          description: 群主的用户 ID
        groupid:
          type: string
          description: 群组 ID
        affiliations:
          type: integer
          description: 群组现有成员数
        type:
          type: string
          description: “group” 群组类型
        lastModified:
          type: number
          description: 最近一次修改的时间戳，单位为毫秒
        groupname:
          type: string
          description: 群组名称
        created:
          type: number
          description: 群组创建的时间戳，单位为毫秒
    UserJoinedGroupResource:
      title: UserJoinedGroupResource
      type: object
      properties:
        id:
          type: string
          description: 群组 ID
        name:
          type: string
          description: 群组名称
        avatar:
          type: string
          description: 群组头像的 URL
        owner:
          type: string
          description: 群主的用户 ID
        description:
          type: string
          description: 群组描述
        disabled:
          type: boolean
          description: 群组是否被禁用： - true：禁用。禁用后不能对群组进行任何修改。 - false：未禁用
        public:
          type: boolean
          description: 是否是公开群： - true：公开群。公开群可以被搜索到，用户可以申请加入公开群。 - false：私有群。私有群无法被搜索到，需要群主或群管理员邀请，用户才可以加入
        allowinvites:
          type: boolean
          description: 是否允许普通群成员邀请用户加入群组： - true：普通群成员可拉人入群; - false：只有群主或者管理员才可以拉人入群
        membersonly:
          type: boolean
          description: 用户申请入群是否需要群主或者群管理员审批。 - true：需要； - false：不需要，用户直接进群
        maxusers:
          type: integer
          description: 群组最大成员数（包括群主）
        created:
          type: number
          description: 群组创建的时间戳，单位为毫秒
    GroupInfoResource:
      title: GroupInfoResource
      type: object
      properties:
        id:
          type: string
          description: 群组 ID，群组唯一标识符
        name:
          type: string
          description: 群组名称
        avatar:
          type: string
          description: 群组头像的 URL
        description:
          type: string
          description: 群组描述
        membersonly:
          type: boolean
          description: 加入群组是否需要群主或者群管理员审批： - true：是； - false：否
        allowinvites:
          type: boolean
          description: 是否允许群成员邀请其他用户加入此群。 - true：允许群成员邀请其他用户加入此群； - false：只有群主可以邀请其他用户入群。 注：该参数仅对私有群有效，因为公开群不允许群成员邀请其他用户入群
        maxusers:
          type: integer
          description: 群组最大成员数，创建群组的时候设置，可修改
        affiliations:
          type: array
          description: 群组成员列表以及对应的角色： - owner：群主； - member：普通成员
          items:
            type: object
        owner:
          type: string
          description: 群主的用户 ID
        created:
          type: number
          description: 创建该群组的 Unix 时间戳
